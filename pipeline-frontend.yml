# =============================================================================
# pipeline-frontend.yml - NeuronCloud 前端部署流水线
# =============================================================================
# 用途：部署前端到公司测试服务器
# 端口：10051
# =============================================================================

sources:
  repo_0:
    type: codeup
    name: neuron-web-clean
    endpoint: https://codeup.aliyun.com/neuron/N3Lite/neuron-web-clean.git
    branch: main
    certificate:
      type: serviceConnection
      serviceConnection: hm9du8rmfraowhyb

defaultWorkspace: repo_0

stages:
  # ===========================================================================
  # 阶段 1：构建（Node + Docker 镜像）
  # ===========================================================================
  stage_build:
    name: "1. 构建"
    jobs:
      job_0:
        name: 前端构建 + Docker镜像
        runsOn:
          group: public/cn-beijing
          labels: linux,amd64
        steps:
          # 步骤 1.1：Node 构建
          step_node:
            name: 前端编译打包
            step: NodeBuild
            with:
              nodeVersion: "18.12"
              run: |
                echo "============================================================"
                echo "  NeuronCloud 前端构建"
                echo "============================================================"
                export NVM_DIR="$HOME/.nvm"
                [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
                nvm install 20
                nvm use 20
                echo "Node: $(node -v)"
                npm install -g pnpm
                pnpm install
                npx vite build
                echo "[INFO] 构建产物:"
                ls -lh dist/ 2>/dev/null || echo "未找到 dist"
                echo "============================================================"

          # 步骤 1.2：Docker 镜像构建推送
          step_docker:
            name: 镜像构建推送
            step: ACRDockerBuild
            with:
              artifact: artifact
              variables: []
              dockerfilePath: Dockerfile-company
              noCache: false
              dockerRegistry: crpi-q1gy3dzwbqy5vieg.cn-heyuan.personal.cr.aliyuncs.com/neuron-cloud/neuron-frontend
              useVpcAddress: false
              buildkitVersion: v0.11.6
              dockerTag: ${DATETIME}
              region: cn-heyuan
              serviceConnection: hfys4zjr796p5ipm
              extraTags:
                - latest
        driven: auto
        plugins: []

  # ===========================================================================
  # 阶段 2：部署
  # ===========================================================================
  stage_deploy:
    name: "2. 部署"
    jobs:
      job_deploy:
        name: 测试服务器部署
        component: VMDockerDeploy
        driven: auto
        with:
          variables:
            - key: tag
              value: $[stages.stage_build.job_0.step_docker.artifacts.artifact]
          useEncode: false
          pauseStrategy: noPause
          machineGroup: cTY11FaiMYWhg3sK
          run: |-
            set -ex

            echo "============================================================"
            echo "  NeuronCloud 前端部署"
            echo "============================================================"

            CONTAINER_NAME="neuron-frontend"

            # 1. 登录 ACR + 拉取镜像
            echo "[INFO] >>> [1/3] 登录ACR并拉取镜像..."
            echo '!mx123456' | docker login --username=mxlc123 --password-stdin crpi-q1gy3dzwbqy5vieg.cn-heyuan.personal.cr.aliyuncs.com
            docker pull "${tag}"

            # 2. 停止旧容器
            echo "[INFO] >>> [2/3] 停止旧容器..."
            docker stop "${CONTAINER_NAME}" 2>/dev/null || true
            docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 3. 启动新容器
            echo "[INFO] >>> [3/3] 启动新容器..."
            docker run -d \
                --name "${CONTAINER_NAME}" \
                --network neuron-net \
                --restart=unless-stopped \
                -e TZ=Asia/Shanghai \
                -p 10051:80 \
                --log-opt max-size=50m \
                --log-opt max-file=3 \
                "${tag}"

            sleep 2
            if docker ps | grep -q "${CONTAINER_NAME}"; then
                echo "[INFO] ✅ 前端部署成功"
                docker ps | grep "${CONTAINER_NAME}"
            else
                echo "[ERROR] 前端部署失败"
                docker logs "${CONTAINER_NAME}" --tail 20
                exit 1
            fi

            echo "============================================================"
          executeUser: root
          batchNumber: 1
        plugins: []
